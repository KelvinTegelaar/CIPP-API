---
name: Validate JSON
on:
  # pull_request_target (not pull_request) so the token can comment on fork PRs.
  # The PR's own code is never executed: it is checked out into ./pr as data only,
  # and parsed by the validator script from the trusted base checkout.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev
    paths:
      - "Config/**/*.json"
      - "Tools/**/*.json"
      - "AddMSPApp/**/*.json"
      - ".github/workflows/Validate_JSON.yml"
      - ".github/scripts/validate-json.mjs"
      - ".github/scripts/validate-json.test.mjs"
  push:
    branches:
      - dev
    paths:
      - "Config/**/*.json"
      - "Tools/**/*.json"
      - "AddMSPApp/**/*.json"
      - ".github/workflows/Validate_JSON.yml"
      - ".github/scripts/validate-json.mjs"
      - ".github/scripts/validate-json.test.mjs"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    name: Parse JSON in Config, Tools and AddMSPApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted validator script)
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test trusted JSON validator
        run: node --test .github/scripts/validate-json.test.mjs

      - name: Checkout PR head (untrusted, data only)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          lfs: false
          submodules: false
          allow-unsafe-pr-checkout: true

      - name: Validate JSON files
        id: validate
        continue-on-error: true
        env:
          ROOT: ${{ github.event_name == 'pull_request_target' && 'pr/' || '' }}
        run: >-
          node .github/scripts/validate-json.mjs --boundary "${ROOT:-.}" --strip "$ROOT"
          "${ROOT}Config" "${ROOT}Tools" "${ROOT}AddMSPApp"

      - name: Comment on PR
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- validate-json -->';
            const resultsFile = 'json-validation-results.json';
            if (!fs.existsSync(resultsFile)) {
              // The validator crashed before reporting; let its own error stand.
              core.warning('No validation results found — skipping PR comment.');
              return;
            }
            let failures;
            try {
              failures = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
            } catch (error) {
              core.warning('Validation results are unreadable — skipping PR comment.');
              return;
            }
            if (!Array.isArray(failures) || failures.some(
              ({ file, message } = {}) => typeof file !== 'string' || typeof message !== 'string'
            )) {
              core.warning('Validation results have an invalid shape — skipping PR comment.');
              return;
            }

            // Presentation escaping prevents PR data from restructuring the Markdown.
            // Workflow-command escaping is handled separately by the validator.
            const present = (value) => String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/[\u0000-\u001f\u007f]/g, ' ');

            // Find a previous comment from this workflow so we update instead of piling up.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            let body;
            if (failures.length > 0) {
              const list = failures
                .map(({ file, message }) =>
                  `- <code>${present(file)}</code>\n  <blockquote><code>${present(message)}</code></blockquote>`
                )
                .join('\n');
              body =
                `${marker}\n### ⚠️ JSON validation failed\n\n` +
                `${failures.length} JSON validation issue(s) were found in this PR. ` +
                `These files are loaded directly by CIPP, so invalid JSON or unsafe filesystem entries break the app at runtime.\n\n` +
                `${list}\n\n` +
                `Please fix the issues and push again — this comment will update automatically.`;
            } else if (existing) {
              body = `${marker}\n### ✅ JSON is valid\n\nAll JSON files in \`Config\`, \`Tools\` and \`AddMSPApp\` parse correctly. Thanks for fixing it!`;
            } else {
              // Nothing was ever broken — stay quiet.
              return;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if validation did not succeed
        if: >-
          always() &&
          (steps.validate.outcome != 'success' ||
          steps.validate.outputs.invalid_count != '0')
        env:
          INVALID_COUNT: ${{ steps.validate.outputs.invalid_count }}
        run: |
          if [[ "$INVALID_COUNT" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$INVALID_COUNT JSON validation issue(s). See annotations above."
          else
            echo "::error::JSON validator output was missing or malformed."
          fi
          exit 1
